[project]
name = "mail-lens-ai"
version = "1.0.0"
description = "NLP-based email security analysis — classifies emails as legitimate, phishing, or malicious"
authors = [
    { name = "Muhammad Haris" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src", "app"]
omit = ["tests/*", "notebooks/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
fail_under = 60
